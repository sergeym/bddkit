name: CI

# Tests run on pull requests only: `main` is protected and every change reaches
# it through a PR, so a green PR is the gate. The release workflow deliberately
# does not re-run them.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test & clippy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          # 5432 for the Rust DB tests, 5433 for examples/db.yaml, which is the
          # file the README tells a reader to run against docker-compose.
          - 5432:5432
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/common/db.rs falls back to port 5433 (docker-compose); the service
      # container above is published on the default port instead.
      BDDKIT_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v6

      # The toolchain is pinned on purpose: on a floating `stable` every new clippy
      # lint reddens PRs that have nothing to do with the change under review.
      # rustflags is emptied so only the clippy invocation below carries -D warnings.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy
          rustflags: ""

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --bin bddkit

      - name: Acceptance tests
        run: cargo test --locked --test acceptance

      - name: Plugin acceptance tests
        run: cargo test --locked --test plugin

      # The apibdd_it fixture schema is shared, so DB tests run single-threaded.
      - name: Database tests
        run: cargo test --locked --test db -- --test-threads=1

      # The examples are the tool's demonstration surface; without this they rot
      # silently and the README's reader is the first to find out. Both suites run
      # exactly as examples/README.md documents them, and a failed scenario exits 1.
      # Smocker cannot be a service container: those start before checkout, so the
      # mock file it mounts does not exist yet.
      - name: Start the example mock server
        run: |
          docker compose up -d smocker
          timeout 60 bash -c 'until curl -sf http://localhost:8081/mocks >/dev/null; do sleep 1; done'

      # docker-compose seeds this through the entrypoint; the service container
      # above comes up empty, so examples/db.yaml's schemas are applied by hand.
      - name: Load the example database schema
        run: psql -v ON_ERROR_STOP=1 "$BDDKIT_TEST_DSN" -f examples/db/init.sql

      - name: Example suites
        run: |
          cargo run --locked --quiet -- run --config examples/api.yaml
          cargo run --locked --quiet -- run --config examples/db.yaml

      - name: Package check
        run: cargo publish --dry-run --locked
