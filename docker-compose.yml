services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./examples/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: apibdd_it
    ports:
      - "3307:3306"

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: apibdd_it
    ports:
      - "3308:3306"

  smocker:
    image: ghcr.io/smocker-dev/smocker:v1.1.2-preview
    environment:
      SMOCKER_INIT_MOCKS: /mocks/api-server.yaml
    ports:
      - "8080:8080"   # mock server, used by examples/api.yaml
      - "8081:8081"   # config API + web UI
    volumes:
      - ./examples/mocks:/mocks:ro
